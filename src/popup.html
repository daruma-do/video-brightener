<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">AutoLift</div>
      <label class="toggle" title="ON/OFF">
        <input type="checkbox" id="enabled">
        <span class="track"></span>
      </label>
    </div>

    <div class="strength-section">
      <div class="strength-header">
        <span>明るさ</span>
        <span class="strength-label" id="strengthLabel">中</span>
      </div>
      <input type="range" id="strength" min="0" max="100" step="1" value="64">
      <div class="strength-ticks">
        <span>弱</span>
        <span>強</span>
      </div>
    </div>

    <div class="presets">
      <button class="preset" data-exp="0.85">弱</button>
      <button class="preset" data-exp="0.65">中</button>
      <button class="preset" data-exp="0.5">強</button>
      <button class="preset" data-exp="0.35">最強</button>
    </div>

    <div class="footer">
      <div class="hint">対応: YouTube / Twitch / ニコニコ / Vimeo / U-NEXT / ABEMA</div>
      <div class="hint subtle">フルスクリーン対応・PiPは仕様上非対応</div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
