<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">Video Brightener</div>
      <label class="toggle" title="ON/OFF">
        <input type="checkbox" id="enabled">
        <span class="track"></span>
      </label>
    </div>

    <div class="control-section">
      <div class="control-header">
        <span>明るさ</span>
        <span class="control-label" id="brightnessLabel">中</span>
      </div>
      <input type="range" id="brightness" min="0" max="100" step="1" value="50">
      <div class="control-ticks">
        <span>弱</span>
        <span>強</span>
      </div>
    </div>

    <div class="control-section">
      <div class="control-header">
        <span>コントラスト</span>
        <span class="control-label" id="contrastLabel">+10%</span>
      </div>
      <input type="range" id="contrast" min="0" max="100" step="1" value="20">
      <div class="control-ticks">
        <span>標準</span>
        <span>強</span>
      </div>
    </div>

    <div class="presets">
      <button class="preset" data-exp="0.85" data-con="1.05">弱</button>
      <button class="preset" data-exp="0.65" data-con="1.10">中</button>
      <button class="preset" data-exp="0.50" data-con="1.15">強</button>
      <button class="preset" data-exp="0.35" data-con="1.20">最強</button>
    </div>

    <div class="footer">
      <div class="hint">対応: YouTube / Twitch / ニコニコ / Vimeo / U-NEXT / ABEMA</div>
      <div class="hint subtle">フルスクリーン対応・PiPは仕様上非対応</div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
